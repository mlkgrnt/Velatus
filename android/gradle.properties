org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The workspace path contains CJK characters. aapt2 and the NDK handle UTF-8
# paths fine; only the AGP sanity check needs to be told to relax.
android.overridePathCheck=true
# This project lives on a slow virtual volume where the Kotlin daemon cannot
# reliably close its incremental caches ("class-fq-name-to-source.tab"). Plain
# batch compilation is slower but reproducible; Flutter's own incremental
# rebuild layer is unaffected.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.useClasspathSnapshot=false
