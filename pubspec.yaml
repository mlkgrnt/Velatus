name: velatus
description: "Velatus (隐格) — a local-first image redaction tool."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  image: ^4.13.1
  shared_preferences: ^2.5.6
  gal: ^3.0.1
  share_plus: ^13.3.1
  desktop_drop: ^0.8.4
  google_mlkit_text_recognition: ^1.0.3
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/velatus_icon_1024.png
